<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Requerimento - IFCE campus Cedro-CE</title>
</head>
<body>
    <header>
        <h1>INSTITUTO FEDERAL</h1>
        <h2>Ceará - Campus Cedro</h2>
        <h3>GUIA DE REQUERIMENTO </h3>
    </header>

    <form action="#" method="post">
        <p> 
        <label for="protocolo">Protocolo n.°</label>
        <input type="text" id="protocolo" name="protocolo">
        </p>

        <fieldset>
            <legend>Dados do Requerente</legend>
            <p> 
                <label for="requerente">REQUERENTE</label>
                <input type="text" id="requerente" name="requerente">
            </p>
            <p> 
                <label for="matricula">N° DE MATRÍCULA</label>
                <input type="text" id="matricula" name="matricula">
            </p>
            <p>
                <label for="data de nascimento">DATA DE NASCIMENTO</label>
                <input type="text" id="data de nascimento" name="data de nascimento">
                <label for="naturalidade">NATURALIDADE</label>
                <input type="text" id="naturalidade" name="naturalidade">
            </p>
            <p>
                <label for="filiacao">FILIAÇÃO</label>
                <input type="text" id="filiacao" name="filiacao">  
            </p>
            <p>
                <label for="curso">CURSO</label>
                <input type="text" id="curso" name="curso">  
                <label for="periodo">PERÍODO</label>
                <input type="text" id="periodo" name="periodo">  
                <label for="turno">TURNO</label>
                <input type="text" id="turno" name="turno">  
            </p>
        </fieldset>

        
    

    </form>
</body>
</html>
